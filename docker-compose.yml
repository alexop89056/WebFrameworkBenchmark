  django-uvicorn4-optimized:
    build: ./services/django
    profiles: ["variants"]
    healthcheck: *healthcheck-python
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--loop", "uvloop", "--http", "httptools"]
