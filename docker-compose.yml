x-healthcheck-python: &healthcheck-python
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 5s

x-healthcheck-wget: &healthcheck-wget
  test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/ >/dev/null"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 5s

x-healthcheck-node: &healthcheck-node
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 5s

x-healthcheck-curl: &healthcheck-curl
  test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 5s

services:
  django:
    build: ./services/django
    profiles: ["baseline"]
    healthcheck: *healthcheck-python
    cpuset: "0"
    ports:
      - "8101:8000"
    restart: "no"

  fastapi:
    build: ./services/fastapi
    profiles: ["baseline"]
    healthcheck: *healthcheck-python
    cpuset: "1"
    ports:
      - "8102:8000"
    restart: "no"

  django-bolt:
    build: ./services/django-bolt
    profiles: ["baseline"]
    healthcheck: *healthcheck-python
    cpuset: "2"
    ports:
      - "8103:8000"
    restart: "no"

  go-echo:
